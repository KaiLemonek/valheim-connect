<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Připojení na Valheim server</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1611;
      color: #f0e6d2;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    p {
      opacity: 0.8;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #7a3b1e;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .btn:hover { background: #9a4b26; }
    code {
      background: rgba(255,255,255,0.08);
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚔️ Připojení na Valheim server</h1>
    <p>Pokud se automaticky neotevře Steam, klikni na tlačítko níže.</p>
    <a class="btn" id="connectBtn" href="steam://connect/172.238.96.215:2456">Připojit se přes Steam</a>
    <p>Nebo zkopíruj adresu ručně: <code>172.238.96.215:2456</code></p>
  </div>
  <script>
    // Zkusi rovnou presmerovat, tlacitko zustava jako fallback
    // (nektere prohlizece automaticke presmerovani na steam:// blokuji bez kliknuti).
    window.location.href = document.getElementById('connectBtn').href;
  </script>
</body>
</html>
